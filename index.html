<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#05070d; --panel:rgba(13,18,28,0.6); --border:rgba(96,165,250,0.14);
    --border-strong:rgba(34,211,238,0.4); --cyan:#22d3ee; --purple:#a78bfa;
    --text:#dbe4f0; --sub:#7c8aa0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#05070d,#060810);color:var(--text);
    font-family:'Rajdhani','Inter',sans-serif;min-height:100vh}
  .display{font-family:'Orbitron',sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 80px}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .between{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .tab-btn{padding:6px 14px;border-radius:999px;font-size:12px;border:1px solid var(--border);
    background:transparent;color:var(--sub);cursor:pointer}
  .tab-btn.active{color:var(--cyan);border-color:var(--border-strong)}
  .btn{padding:7px 14px;border-radius:8px;font-size:12px;border:1px solid var(--border-strong);
    background:rgba(34,211,238,0.08);color:var(--cyan);cursor:pointer}
  .btn.ghost{background:transparent;color:var(--sub);border-color:var(--border)}
  .btn.purple{color:var(--purple);border-color:rgba(167,139,250,0.4);background:rgba(167,139,250,0.08)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  input,textarea{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);
    border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--border-strong)}
  .grid5{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media(min-width:640px){.grid5{grid-template-columns:repeat(5,1fr)}}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .quest-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:1px solid var(--border);border-radius:10px;padding:12px;flex-wrap:wrap}
  .badge{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--border)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;
    justify-content:center;padding:16px;z-index:50}
  .modal{background:rgba(13,18,28,0.97);border:1px solid var(--border-strong);border-radius:14px;
    padding:20px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto}
  .avatar{width:56px;height:56px;border-radius:999px;object-fit:cover;border:1px solid var(--border-strong)}
  .avatar-placeholder{width:56px;height:56px;border-radius:999px;display:flex;align-items:center;
    justify-content:center;font-size:11px;color:var(--sub);border:1px solid var(--border);
    background:rgba(255,255,255,0.03)}
  .banner-error{position:fixed;top:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:10px 16px;
    font-size:13px;text-align:center;z-index:60}
  a{color:var(--cyan)}
  ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:4px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ========================================================================
   CONFIG — the only two values you need to fill in. Both are meant to be
   public (that's what the "anon" key is for); your database's Row Level
   Security is what actually keeps data private.
   ======================================================================== */
const SUPABASE_URL = "https://aesvbnqkwzgkjenbykaw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_JDJMVy6dpjayangMG-IFfQ_IuoBb9Wl";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ATTRS = ["Strength","Intelligence","Vitality","Agility","Discipline","Charisma","Wealth","Career","Technical","Social"];
const DIFFICULTIES = ["Very Easy","Easy","Medium","Hard","Very Hard","Legendary"];
const TYPES = ["Daily","Weekly","Main","Side","Habit","Challenge","Emergency"];
const ONE_TIME = ["Main","Side","Challenge","Emergency"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

let state = {
  session: null, loading: true, status: null, attributes: [], quests: [],
  occurrences: [], mailbox: [], perf: [], shop: [],
  tab: "dashboard", showQuestForm: false, authError: null,
  friendships: [], friendStatuses: {}, myProfile: null,
};

function dateKey(d = new Date()) { return d.toLocaleDateString("en-CA"); }
function getMonday(d) { const dt = new Date(d); const day = dt.getDay(); const diff = day === 0 ? -6 : 1 - day; dt.setDate(dt.getDate() + diff); return dt; }
function occurrenceKeyFor(q) {
  if (q.quest_type === "Weekly") return dateKey(getMonday(new Date()));
  if (q.quest_type === "Daily" || q.quest_type === "Habit") return dateKey();
  return "once";
}
function esc(s) { return (s ?? "").toString().replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

/* ---------------- data loading ---------------- */

async function refreshAll() {
  const [status, attributes, quests, mailbox, perf, shop] = await Promise.all([
    sb.from("v_player_status").select("*").single().then(r => r.data),
    sb.from("player_attributes").select("*").order("attribute_key").then(r => r.data || []),
    sb.from("quests").select("*").eq("active", true).order("created_at").then(r => r.data || []),
    sb.from("mailbox_messages").select("*").order("created_at", { ascending: false }).limit(10).then(r => r.data || []),
    sb.from("v_completions_by_type").select("*").then(r => r.data || []),
    sb.from("shop_rewards").select("*").eq("active", true).order("cost").then(r => r.data || []),
  ]);
  const ids = quests.map(q => q.id);
  const occurrences = ids.length
    ? (await sb.from("quest_events").select("*").in("quest_id", ids)).data || []
    : [];
  state = { ...state, status, attributes, quests, mailbox, perf, shop, occurrences };
  render();
}

async function loadFriends() {
  const { data: profile } = await sb.from("profiles").select("*").single();
  state.myProfile = profile;
  const { data: userRes } = await sb.auth.getUser();
  const uid = userRes.user.id;
  const { data: friendships } = await sb.from("friendships").select("*").or(`requester_id.eq.${uid},addressee_id.eq.${uid}`);
  state.friendships = friendships || [];
  const accepted = state.friendships.filter(f => f.status === "accepted");
  const statuses = {};
  for (const f of accepted) {
    const otherId = f.requester_id === uid ? f.addressee_id : f.requester_id;
    const { data } = await sb.rpc("get_friend_status", { p_friend_id: otherId });
    statuses[otherId] = data?.[0] ?? null;
  }
  state.friendStatuses = statuses;
  render();
}

/* ---------------- actions ---------------- */

async function signIn() {
  await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: window.location.origin } });
}
async function signOut() { await sb.auth.signOut(); }

async function doComplete(id) { await sb.rpc("complete_quest_occurrence", { p_quest_id: id }); await refreshAll(); }
async function doFail(id) { await sb.rpc("fail_quest_occurrence", { p_quest_id: id }); await refreshAll(); }
async function doRecover(id, key) { await sb.rpc("attempt_recovery", { p_quest_id: id, p_occurrence_key: key }); await refreshAll(); }
async function doDeleteQuest(id) { await sb.from("quests").delete().eq("id", id); await refreshAll(); }

async function doRedeem(id) { await sb.rpc("redeem_reward", { p_reward_id: id }); await refreshAll(); }
async function doDeleteReward(id) { await sb.from("shop_rewards").delete().eq("id", id); await refreshAll(); }
async function doAddReward() {
  const name = document.getElementById("shop-name").value.trim();
  const cost = parseInt(document.getElementById("shop-cost").value, 10) || 0;
  if (!name || cost <= 0) return;
  const { data: userRes } = await sb.auth.getUser();
  await sb.from("shop_rewards").insert({ name, cost, user_id: userRes.user.id });
  await refreshAll();
}

async function saveName() {
  const name = document.getElementById("display-name-input").value.trim();
  if (!name) return;
  const { data: userRes } = await sb.auth.getUser();
  await sb.from("profiles").update({ display_name: name }).eq("id", userRes.user.id);
  await refreshAll();
  const msg = document.getElementById("name-saved-msg");
  if (msg) { msg.style.display = "block"; setTimeout(() => msg.style.display = "none", 2000); }
}

async function uploadAvatar(fileInput) {
  const file = fileInput.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) { alert("Please choose an image file."); return; }
  if (file.size > 3 * 1024 * 1024) { alert("Image must be under 3MB."); return; }
  const { data: userRes } = await sb.auth.getUser();
  const userId = userRes.user.id;
  const path = `${userId}/avatar.${file.name.split(".").pop()}`;
  const { error: upErr } = await sb.storage.from("avatars").upload(path, file, { upsert: true });
  if (upErr) { alert("Upload failed: " + upErr.message); return; }
  const { data: urlData } = sb.storage.from("avatars").getPublicUrl(path);
  await sb.from("profiles").update({ avatar_url: `${urlData.publicUrl}?t=${Date.now()}` }).eq("id", userId);
  await refreshAll();
}

async function findAndAddFriend() {
  const code = document.getElementById("friend-code-input").value.trim();
  const msgEl = document.getElementById("friend-msg");
  if (!code) return;
  const { data, error } = await sb.rpc("find_user_by_code", { p_code: code });
  if (error) { msgEl.textContent = error.message; return; }
  const found = data?.[0];
  if (!found) { msgEl.textContent = "No player found with that code."; return; }
  const { error: reqErr } = await sb.rpc("send_friend_request", { p_addressee: found.user_id });
  msgEl.textContent = reqErr ? reqErr.message : `Friend request sent to ${found.display_name}.`;
  document.getElementById("friend-code-input").value = "";
  await loadFriends();
}
async function respondFriend(id, accept) {
  await sb.rpc("respond_friend_request", { p_friendship_id: id, p_accept: accept });
  await loadFriends();
}

async function createQuestSubmit() {
  const name = document.getElementById("q-name").value.trim();
  const type = document.getElementById("q-type").value;
  const difficulty = document.getElementById("q-difficulty").value;
  const attrs = Array.from(document.querySelectorAll(".q-attr:checked")).map(el => el.value);
  const days = Array.from(document.querySelectorAll(".q-day:checked")).map(el => parseInt(el.value, 10));
  const deadline = document.getElementById("q-deadline")?.value || null;
  const errEl = document.getElementById("q-error");
  if (!name || attrs.length === 0 || (type === "Habit" && days.length === 0)) {
    errEl.textContent = "Fill in a name, at least one attribute" + (type === "Habit" ? ", and at least one day." : ".");
    return;
  }
  const { data: userRes } = await sb.auth.getUser();
  const { error } = await sb.from("quests").insert({
    user_id: userRes.user.id, name, quest_type: type, difficulty, attributes: attrs,
    recurrence_days: type === "Habit" ? days : null,
    deadline: ONE_TIME.includes(type) && deadline ? deadline : null, active: true,
  });
  if (error) { errEl.textContent = error.message; return; }
  state.showQuestForm = false;
  await refreshAll();
}

/* ---------------- rendering ---------------- */

function render() {
  const app = document.getElementById("app");
  if (state.loading) { app.innerHTML = `<div style="min-height:100vh"></div>`; return; }
  if (!state.session) { app.innerHTML = loginView(); return; }

  app.innerHTML = `
    ${state.tab === "shop" ? "" : ""}
    <div class="wrap">
      <div class="between" style="margin-bottom:20px">
        <div class="display" style="color:var(--cyan);font-size:14px;letter-spacing:.3em">SYSTEM</div>
        <div class="row" style="gap:6px">
          ${["dashboard","shop","friends","settings"].map(t => `
            <button class="tab-btn ${state.tab===t?'active':''}" onclick="setTab('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>
          `).join("")}
          <button class="tab-btn" onclick="signOut()">Sign out</button>
        </div>
      </div>
      <div id="tab-content"></div>
    </div>
    ${state.showQuestForm ? questFormModal() : ""}
  `;

  const content = document.getElementById("tab-content");
  if (state.tab === "dashboard") content.innerHTML = dashboardView();
  else if (state.tab === "shop") content.innerHTML = shopView();
  else if (state.tab === "friends") { content.innerHTML = friendsView(); if (!state.myProfile) loadFriends(); }
  else if (state.tab === "settings") content.innerHTML = settingsView();
}

function loginView() {
  return `
    ${state.authError ? `<div class="banner-error">Sign-in error: ${esc(state.authError)}</div>` : ""}
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:16px">
      <div class="display" style="color:var(--cyan);font-size:13px;letter-spacing:.3em">SYSTEM INITIALIZING...</div>
      <div style="font-size:26px;font-weight:800">PLAYER IDENTIFICATION REQUIRED</div>
      <button class="btn" style="padding:12px 24px;font-size:14px" onclick="signIn()">Sign in with Google</button>
    </div>
  `;
}

function dashboardView() {
  const s = state.status;
  if (!s) return `<div class="panel">Loading your status...</div>`;
  return `
    <div class="panel row" style="margin-bottom:16px">
      ${s.avatar_url ? `<img class="avatar" src="${esc(s.avatar_url)}" alt="">` : `<div class="avatar-placeholder">No pic</div>`}
      <div>
        <div style="font-size:22px;font-weight:800">${esc(s.display_name)} · Lv.${s.global_level}</div>
        <div style="color:var(--sub);font-size:14px">${esc(s.global_rank)} Rank · ${s.coins} Coins · ${s.current_streak} day streak</div>
      </div>
    </div>

    <div class="grid5" style="margin-bottom:16px">
      ${state.attributes.map(a => `
        <div class="panel" style="padding:10px">
          <div style="font-size:11px;color:var(--sub)">${a.attribute_key}</div>
          <div style="font-weight:700;font-size:13px">Lv.${a.level} · ${a.rank}</div>
        </div>
      `).join("")}
    </div>

    <div class="between" style="margin-bottom:8px">
      <div style="font-size:12px;color:var(--sub)">Your quests</div>
      <button class="btn" onclick="state.showQuestForm=true;render()">+ Create Quest</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
      ${state.quests.length === 0 ? `<div style="color:var(--sub);font-size:14px">No active quests yet. Click "+ Create Quest" above.</div>` : state.quests.map(q => questRow(q)).join("")}
    </div>

    <div class="panel" style="margin-bottom:16px">
      <div style="font-size:12px;color:var(--sub);margin-bottom:8px">Completions by quest type</div>
      <div class="row" style="font-size:12px">
        ${state.perf.length === 0 ? `<span style="color:#475569">No completions yet.</span>` : state.perf.map(p => `<span>${p.quest_type}: ${p.completions}</span>`).join("")}
      </div>
    </div>

    <div class="panel">
      <div style="font-size:12px;color:var(--sub);margin-bottom:8px">Recent messages</div>
      ${state.mailbox.length === 0 ? `<div style="color:var(--sub);font-size:14px">No messages yet.</div>` : state.mailbox.map(m => `
        <div style="font-size:14px;margin-bottom:4px"><span style="color:var(--cyan)">${esc(m.subject)}</span> — <span style="color:var(--sub)">${esc(m.body)}</span></div>
      `).join("")}
    </div>
  `;
}

function questRow(q) {
  const key = occurrenceKeyFor(q);
  const occ = state.occurrences.find(o => o.quest_id === q.id && o.occurrence_key === key);
  const isFailed = occ?.status === "failed";
  const isDone = occ?.status === "completed" || occ?.status === "recovered";
  return `
    <div class="quest-row">
      <div>
        <div style="font-weight:600;font-size:14px">${esc(q.name)}</div>
        <div style="font-size:12px;color:var(--sub)">${q.quest_type} · ${q.difficulty} · ${q.attributes.join(", ")}</div>
      </div>
      <div class="row">
        ${!isDone && !isFailed ? `
          <button class="btn" onclick="doComplete('${q.id}')">Complete</button>
          <button class="btn ghost" onclick="doFail('${q.id}')">Fail</button>
        ` : ""}
        ${isDone ? `<span style="color:var(--cyan);font-size:12px">Done today</span>` : ""}
        ${isFailed ? `<button class="btn purple" onclick="doRecover('${q.id}','${key}')">Recover</button>` : ""}
        <button class="btn ghost" onclick="doDeleteQuest('${q.id}')">✕</button>
      </div>
    </div>
  `;
}

function questFormModal() {
  return `
    <div class="modal-bg" onclick="if(event.target===this){state.showQuestForm=false;render();}">
      <div class="modal">
        <div class="between" style="margin-bottom:14px">
          <span class="display" style="color:var(--cyan);font-size:13px;letter-spacing:.15em">NEW QUEST</span>
          <button class="btn ghost" onclick="state.showQuestForm=false;render()">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;font-size:13px">
          <div>
            <div style="color:var(--sub);font-size:12px;margin-bottom:4px">Name</div>
            <input id="q-name" placeholder="e.g. Study Turkish">
          </div>
          <div>
            <div style="color:var(--sub);font-size:12px;margin-bottom:4px">Type</div>
            <select id="q-type" onchange="onQuestTypeChange()" style="width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text)">
              ${TYPES.map(t => `<option value="${t}">${t}</option>`).join("")}
            </select>
          </div>
          <div>
            <div style="color:var(--sub);font-size:12px;margin-bottom:4px">Difficulty</div>
            <select id="q-difficulty" style="width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text)">
              ${DIFFICULTIES.map(d => `<option value="${d}">${d}</option>`).join("")}
            </select>
          </div>
          <div>
            <div style="color:var(--sub);font-size:12px;margin-bottom:4px">Attributes (each gets full XP)</div>
            <div class="grid2">
              ${ATTRS.map(a => `<label style="display:flex;gap:6px;align-items:center;border:1px solid var(--border);border-radius:6px;padding:6px 8px">
                <input type="checkbox" class="q-attr" value="${a}"> ${a}
              </label>`).join("")}
            </div>
          </div>
          <div id="q-days-wrap" style="display:none">
            <div style="color:var(--sub);font-size:12px;margin-bottom:4px">Days of week</div>
            <div class="row">
              ${DOW.map((d,i) => `<label style="display:flex;flex-direction:column;align-items:center;font-size:11px">
                <input type="checkbox" class="q-day" value="${i}">${d}
              </label>`).join("")}
            </div>
          </div>
          <div id="q-deadline-wrap" style="display:none">
            <div style="color:var(--sub);font-size:12px;margin-bottom:4px">Deadline (optional)</div>
            <input id="q-deadline" type="date">
          </div>
          <div id="q-error" style="color:#fb7185;font-size:12px"></div>
        </div>
        <div class="row" style="justify-content:flex-end;margin-top:16px">
          <button class="btn ghost" onclick="state.showQuestForm=false;render()">Cancel</button>
          <button class="btn" onclick="createQuestSubmit()">Create Quest</button>
        </div>
      </div>
    </div>
  `;
}
function onQuestTypeChange() {
  const type = document.getElementById("q-type").value;
  document.getElementById("q-days-wrap").style.display = type === "Habit" ? "block" : "none";
  document.getElementById("q-deadline-wrap").style.display = ONE_TIME.includes(type) ? "block" : "none";
}

function shopView() {
  const coins = state.status?.coins ?? 0;
  return `
    <div style="font-size:12px;color:var(--sub);margin-bottom:12px">System Shop · ${coins} coins available</div>
    <div class="row" style="margin-bottom:16px">
      <input id="shop-name" placeholder="Reward name" style="max-width:220px">
      <input id="shop-cost" type="number" value="100" style="max-width:100px">
      <button class="btn" onclick="doAddReward()">Add Reward</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${state.shop.length === 0 ? `<div style="color:var(--sub);font-size:14px">No rewards yet — add one above.</div>` : state.shop.map(r => `
        <div class="quest-row">
          <div>
            <div style="font-weight:600;font-size:14px">${esc(r.name)}</div>
            <div style="font-size:12px;color:#fbbf24">${r.cost} coins</div>
          </div>
          <div class="row">
            <button class="btn" ${coins < r.cost ? "disabled" : ""} onclick="doRedeem('${r.id}')">Redeem</button>
            <button class="btn ghost" onclick="doDeleteReward('${r.id}')">✕</button>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function friendsView() {
  const p = state.myProfile;
  const incoming = state.friendships.filter(f => f.status === "pending" && p && f.addressee_id === p.id);
  const statuses = state.friendStatuses;
  return `
    <div style="font-size:12px;color:var(--sub);margin-bottom:8px">
      Your friend code: <span style="color:var(--cyan);font-family:monospace;letter-spacing:.15em">${p ? esc(p.player_code) : "..."}</span> — share it so others can add you.
    </div>
    <div class="row" style="margin-bottom:8px">
      <input id="friend-code-input" placeholder="Enter a friend code" style="max-width:220px">
      <button class="btn" onclick="findAndAddFriend()">Add</button>
    </div>
    <div id="friend-msg" style="font-size:12px;color:var(--sub);margin-bottom:12px"></div>
    ${incoming.length > 0 ? `
      <div style="font-size:12px;color:var(--sub);margin-bottom:8px">Pending requests</div>
      ${incoming.map(f => `
        <div class="row between" style="margin-bottom:6px">
          <span style="font-size:14px">Request from a player</span>
          <div class="row">
            <button class="btn" onclick="respondFriend('${f.id}', true)">Accept</button>
            <button class="btn ghost" onclick="respondFriend('${f.id}', false)">Decline</button>
          </div>
        </div>
      `).join("")}
    ` : ""}
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
      ${Object.keys(statuses).length === 0 ? `<div style="color:var(--sub);font-size:14px">No friends yet. Add one with their code above.</div>` : Object.values(statuses).map(s => `
        <div class="panel">
          <div style="font-weight:600;font-size:14px">${esc(s.display_name)}</div>
          <div style="font-size:12px;color:var(--sub)">Level ${s.global_level} · ${s.global_rank} Rank · Streak ${s.current_streak} (best ${s.longest_streak})${s.selected_title ? ` · "${esc(s.selected_title)}"` : ""}</div>
        </div>
      `).join("")}
    </div>
  `;
}

function settingsView() {
  const s = state.status;
  return `
    <div style="max-width:420px">
      <div style="font-size:12px;color:var(--sub);margin-bottom:8px">Player Icon</div>
      <div class="row" style="margin-bottom:20px">
        ${s?.avatar_url ? `<img class="avatar" src="${esc(s.avatar_url)}" alt="">` : `<div class="avatar-placeholder">None</div>`}
        <div>
          <input type="file" accept="image/*" id="avatar-input" style="display:none" onchange="uploadAvatar(this)">
          <button class="btn" onclick="document.getElementById('avatar-input').click()">Change Icon</button>
        </div>
      </div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:8px">Display Name</div>
      <div class="row">
        <input id="display-name-input" value="${esc(s?.display_name || '')}" style="max-width:220px">
        <button class="btn" onclick="saveName()">Save</button>
      </div>
      <div id="name-saved-msg" style="display:none;color:var(--cyan);font-size:12px;margin-top:6px">Saved.</div>
    </div>
  `;
}

function setTab(t) { state.tab = t; render(); }

/* ---------------- boot ---------------- */

const hashParams = new URLSearchParams(window.location.search);
state.authError = hashParams.get("authError");

sb.auth.getSession().then(({ data }) => {
  state.session = data.session;
  state.loading = false;
  render();
  if (state.session) { runInitialLoad(); }
});
sb.auth.onAuthStateChange((_event, session) => {
  const wasLoggedOut = !state.session;
  state.session = session;
  render();
  if (session && wasLoggedOut) runInitialLoad();
});

async function runInitialLoad() {
  await sb.rpc("run_backfill");
  await refreshAll();
}
</script>
</body>
</html>
